version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
    - gocritic
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # テストコードでは緩めに
      - path: _test\.go
        linters:
          - unparam
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
